x-arcane:
  icon: https://my-cdn.badalpe.com/icons/frp.icon.png
  urls:
    - https://github.com/fatedier/frp

services:
  frpc:
    container_name: frpc
    image: fatedier/frpc:v0.71.0@sha256:99ece6a2b62cfc68731e0df289af804ff1c699911cfc47871856434f1d6d53ee
    restart: always
    network_mode: host
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    command: ["-c", "/etc/frp/frpc.toml"]